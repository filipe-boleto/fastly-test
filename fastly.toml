# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = ["MonetizationOS"]
description = "MonetizationOS Proxy Worker for Fastly Compute"
language = "javascript"
manifest_version = 3
name = "monetizationos-fastly-proxy"
service_id = ""

[local_server]

  [local_server.backends]

    [local_server.backends.origin]
      url = "https://news.wingorigin.dev"
      override_host = "news.wingorigin.dev"

    [local_server.backends.monetization_api]
      url = "https://api.monetizationos.com"
      override_host = "api.monetizationos.com"

  [local_server.config_stores]

    [local_server.config_stores.config]
      format = "inline-toml"

      [local_server.config_stores.config.contents]
        ORIGIN_URL = "https://news.wingorigin.dev"
        SURFACE_SLUG = "future-herald-web"
        AUTHENTICATED_USER_JWT_COOKIE_NAME = "__session"
        ANONYMOUS_SESSION_COOKIE_NAME = "anon-session-id"
        INJECT_SCRIPT_URL = "https://assets.monetizationos.com/web-components-latest.js"
        MONETIZATION_OS_HOST = "https://api.monetizationos.com"
        MONETIZATION_OS_ENDPOINTS_PREFIX = "/mos-endpoints/"

  [local_server.secret_stores]

    [[local_server.secret_stores.secrets]]
      key = "MONETIZATION_OS_SECRET_KEY"
      data = "base64 value added here"

[setup]

  [setup.backends]

    [setup.backends.origin]
      address = "news.wingorigin.dev"
      description = "The origin URL for your website."

    [setup.backends.monetization_api]
      address = "api.monetizationos.com"
      description = "The MonetizationOS API host."

  [setup.config_stores]

    [setup.config_stores.config]
      description = "MonetizationOS configuration"

      [[setup.config_stores.config.items]]
        key = "ORIGIN_URL"
        description = "The origin URL for your website."
        value = "https://news.wingorigin.dev"

      [[setup.config_stores.config.items]]
        key = "SURFACE_SLUG"
        description = "The slug for the surface you want to target."
        value = "future-herald-web"

      [[setup.config_stores.config.items]]
        key = "AUTHENTICATED_USER_JWT_COOKIE_NAME"
        description = "The cookie used to identify authenticated user JWT sessions."
        value = "__session"

      [[setup.config_stores.config.items]]
        key = "ANONYMOUS_SESSION_COOKIE_NAME"
        description = "The cookie used to identify anonymous sessions."
        value = "anon-session-id"

      [[setup.config_stores.config.items]]
        key = "INJECT_SCRIPT_URL"
        description = "The URL of the script to inject for web components."
        value = "https://assets.monetizationos.com/web-components-latest.js"

      [[setup.config_stores.config.items]]
        key = "MONETIZATION_OS_HOST"
        description = "The MonetizationOS API host."
        value = "https://api.monetizationos.com"

      [[setup.config_stores.config.items]]
        key = "MONETIZATION_OS_ENDPOINTS_PREFIX"
        description = "The MonetizationOS API endpoints prefix."
        value = "/mos-endpoints/"

  [setup.secret_stores]

    [setup.secret_stores.secrets]
      description = "MonetizationOS secrets"

      [[setup.secret_stores.secrets.items]]
        key = "MONETIZATION_OS_SECRET_KEY"
        description = "Your MonetizationOS Secret Key, base64-encoded. To encode: echo -n 'your_secret_key' | base64"

[scripts]
  build = "pnpm run build"
  post_init = "pnpm install"